name: WRHA Hub integrity checks
on:
  pull_request:
    paths:
      - 'wrha-hub/**'
      - 'index.html'
  push:
    branches:
      - wrha-manual-resource-hub
    paths:
      - 'wrha-hub/**'
  workflow_dispatch:
jobs:
  catalogue-audit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate catalogue and local assets
        run: node wrha-hub/audit.mjs
